# Lilith's Throne Game Configuration
# Modify these values to tune game behavior without recompilation

# Frame rate and timing
game.fps=60
game.max_delta_time_ms=50
game.frame_skip_threshold=3

# Memory management
memory.threshold.high=0.8
memory.threshold.critical=0.95
memory.collect_interval_ms=5000

# Caching
cache.max_size=1000
cache.lru_load_factor=0.75
cache.ttl_seconds=3600

# Object pooling
pool.growth_factor=1.5
pool.initial_size=100
pool.max_size=10000

# UI dimensions
ui.portrait_size=150
ui.line_height=25
ui.response_height=35
ui.default_width=1280
ui.default_height=720

# Persistence
persistence.binary_cache_dir=cache/binary
persistence.snapshot_interval_seconds=300
persistence.autosave_interval_seconds=60
persistence.max_delta_count=10

# Dialogue system
dialogue.max_history=100
dialogue.choice_timeout_seconds=300

# Combat system
combat.turn_timeout_seconds=60
combat.animation_speed_factor=1.0

# Performance monitoring
monitor.enabled=true
monitor.log_interval_seconds=10
monitor.gc_threshold_percent=5

# Debug settings
debug.log_level=INFO
debug.show_frame_time=false
debug.show_memory_stats=false
